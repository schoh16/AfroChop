services:
  - type: web
    name: afrochop-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Demo deployment. NODE_ENV must not be "production" for DEV_SKIP_COMPLIANCE
      # to take effect; switch to production and remove the flag at launch.
      - key: NODE_ENV
        value: staging
      - key: DEV_SKIP_COMPLIANCE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: afrochop-db
          property: connectionString
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: VERIFICATION_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: afrochop-db
    plan: free
    databaseName: afrochef
    user: afrochef
