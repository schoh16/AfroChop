services:
  - type: web
    name: afrochop-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Demo deployment. NODE_ENV must not be "production" for DEV_SKIP_COMPLIANCE
      # to take effect; switch to production and remove the flag at launch.
      - key: NODE_ENV
        value: staging
      - key: DEV_SKIP_COMPLIANCE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: afrochop-db
          property: connectionString
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: VERIFICATION_ENCRYPTION_KEY
        generateValue: true
      - key: STAFF_APPLICATION_EMAILS
        sync: false
      - key: STAFF_APPLICATION_SMS_NUMBERS
        sync: false
      - key: STAFF_ALERTS_FROM_EMAIL
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false

databases:
  - name: afrochop-db
    plan: free
    databaseName: afrochef
    user: afrochef
