services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: afrochef
      POSTGRES_USER: afrochef
      POSTGRES_PASSWORD: afrochef
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrochef -d afrochef"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - afrochef-network
    ports:
      - '127.0.0.1:5432:5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - afrochef-network
    expose:
      - '6379'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DEV_SKIP_COMPLIANCE: ${DEV_SKIP_COMPLIANCE:-false}
      DATABASE_URL: postgresql://afrochef:afrochef@postgres:5432/afrochef?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8082,http://localhost:8081}
      VERIFICATION_ENCRYPTION_KEY: ${VERIFICATION_ENCRYPTION_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_LIVE_PAYMENTS_ENABLED: ${STRIPE_LIVE_PAYMENTS_ENABLED:-false}
      CHECKOUT_RETURN_URL: ${CHECKOUT_RETURN_URL:-}
      STRIPE_CONNECT_RETURN_URL: ${STRIPE_CONNECT_RETURN_URL:-}
      STRIPE_CONNECT_REFRESH_URL: ${STRIPE_CONNECT_REFRESH_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      IDENTITY_VERIFICATION_ENABLED: ${IDENTITY_VERIFICATION_ENABLED:-false}
      BACKGROUND_SCREENING_ENABLED: ${BACKGROUND_SCREENING_ENABLED:-false}
      ADDRESS_VERIFICATION_ENABLED: ${ADDRESS_VERIFICATION_ENABLED:-false}
      SELLER_PHOTOS_BUCKET: ${SELLER_PHOTOS_BUCKET:-afrochop}
      SELLER_PHOTOS_REGION: ${SELLER_PHOTOS_REGION:-us-east-2}
      SELLER_PHOTOS_PUBLIC_URL: ${SELLER_PHOTOS_PUBLIC_URL:-https://d2jbz102fyu4za.cloudfront.net}
      SELLER_PHOTOS_ENDPOINT: ${SELLER_PHOTOS_ENDPOINT:-}
      SELLER_PHOTOS_ACCESS_KEY_ID: ${SELLER_PHOTOS_ACCESS_KEY_ID:-}
      SELLER_PHOTOS_SECRET_ACCESS_KEY: ${SELLER_PHOTOS_SECRET_ACCESS_KEY:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_SHEET_NAME: ${GOOGLE_SHEETS_SHEET_NAME:-Contacts}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
    ports:
      - '3000:3000'
    networks:
      - afrochef-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:

networks:
  afrochef-network:
    driver: bridge
