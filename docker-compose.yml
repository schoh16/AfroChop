version: "3.9"

services:
  app:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run web -- --host 0.0.0.0
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
